# Default experiment configuration for repurpose-verify.
# Relative paths are resolved against the project root.

[paths]
data_dir = "data"
cache_dir = "data/cache"
runs_dir = "runs"

[time]
# Knowledge cutoff: every source the agent can query is restricted to <= cutoff.
cutoff = "2021-12-31"
# Ground-truth window: drug-disease pairs that first reach a trial/approval in (cutoff, eval_end].
eval_end = "2026-12-31"

[kg]
# PrimeKG (Chandak et al., Sci Data 2023) - compiled from DrugBank, Reactome, DisGeNET, ... in 2021.
# nodes.tab + edges.csv (395 MB) carry the same graph as the monolithic kg.csv (982 MB), which
# repeats every node's name on both sides of each edge. kg.csv stays as a fallback.
nodes_url = "https://dataverse.harvard.edu/api/access/datafile/6180617?format=original"
edges_url = "https://dataverse.harvard.edu/api/access/datafile/6180616?format=original"
nodes_file = "data/raw/primekg/nodes.csv"
edges_file = "data/raw/primekg/edges.csv"
url = "https://dataverse.harvard.edu/api/access/datafile/6180620"
raw_file = "data/raw/primekg/kg.csv"
processed_dir = "data/processed/kg"
# MONDO ontology: synonyms + MeSH cross-references used for entity grounding.
mondo_url = "http://purl.obolibrary.org/obo/mondo.obo"
mondo_file = "data/raw/mondo/mondo.obo"
# HGNC gene symbol aliases, joined to gene nodes by NCBI gene id. Without them an agent that
# writes "COX-2" instead of PTGS2 is scored as having invented an entity.
hgnc_url = "https://storage.googleapis.com/public-download-files/hgnc/tsv/tsv/hgnc_complete_set.txt"
hgnc_file = "data/raw/hgnc/hgnc_complete_set.txt"
# Also index HGNC's long alias/previous *names*, not just symbols. Off by default: they are
# descriptive phrases that collide with other node types.
hgnc_alias_names = false
# Explicit mention -> node pins for aliases where curated sources disagree with pharmacology
# usage (see the file's own notes). Applied ahead of every name and alias lookup.
alias_overrides = "data/manual/gene_aliases.csv"

[groundtruth]
out_dir = "data/processed/groundtruth"
# Post-cutoff trials that count as a positive (CT.gov phase labels).
post_phases = ["PHASE2", "PHASE3", "PHASE4"]
# Keep only trials in which exactly one KG drug is tested (drops add-on / combination noise).
single_drug_trials = true
# Optional curated list of FDA/EMA approvals of new indications after the cutoff.
manual_approvals = "data/manual/approvals_after_cutoff.csv"
# Similarity threshold (0-100) for fuzzy name matching when exact/synonym lookup fails; 0 disables.
fuzzy_threshold = 95
# Number of evaluation diseases to sample (0 = all diseases that have at least one positive).
n_eval_diseases = 200
min_positives_per_disease = 1
# Evaluation diseases must have at least this many associated genes in the KG. PrimeKG leaves
# 39% of the diseases carrying a positive with no disease_protein edge at all; on those, no
# mechanism path can end at the disease, so every system's proposals would be unverifiable for
# a reason unrelated to the model. Set to 0 to keep them and report the strata separately.
min_disease_genes = 1
seed = 13

[pubmed]
# NCBI asks for a contact e-mail; set NCBI_API_KEY in the environment to raise the rate limit.
email = ""
api_key_env = "NCBI_API_KEY"
max_results = 5

[verifier]
# Accept an edge when a cited (pre-cutoff) PubMed abstract co-mentions both endpoints.
accept_literature = true
# Query Open Targets for gene-disease edges missing from the KG. Off by default: the live
# Open Targets release contains post-cutoff evidence (see README, "Leakage").
use_opentargets = false
opentargets_min_score = 0.1
max_path_edges = 4
min_path_edges = 2
# Require the drug -> protein hop to be a curated drug *target*, not a metabolising enzyme,
# transporter or carrier. PrimeKG merges all four into drug_protein, so the default verifier
# accepts paths that are pharmacokinetics rather than mechanism. Off by default to keep the
# released runs comparable; the stricter reading is reported as a sensitivity analysis.
require_target_first_edge = false

[agent]
top_k = 20
max_steps = 16
# How unverified proposals are ranked in rag_verify mode: "drop" or "demote".
unverified_policy = "demote"
# Give rejected proposals back to the agent once so it can repair or replace them.
revise_rounds = 1
# One worker by default. A single local server (Ollama, one vLLM replica) serialises requests
# anyway, and firing four concurrent turns at Ollama was observed to leave sockets established
# with no response ever arriving - the run then sat in the client timeout. Raise this only
# against a server you know serves requests in parallel.
workers = 1

[eval]
ks = [1, 5, 10, 20]
bootstrap = 1000
seed = 13

# ---------------------------------------------------------------------------
# Model profiles. `knowledge_cutoff` must be copied from the model card; it is
# reported next to every result so readers can judge weight-level leakage.
# ---------------------------------------------------------------------------

[models.local-llama]
backend = "openai_compat"              # vLLM / Ollama / llama.cpp server
model = "llama3.1:8b"
base_url = "http://localhost:11434/v1"
api_key_env = "LOCAL_LLM_API_KEY"
tool_mode = "native"                   # "native" function calling or "react" text protocol
knowledge_cutoff = "2023-12"           # verify on the model card
temperature = 0.0
max_tokens = 4096
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0

[models.qwen25-7b]
backend = "openai_compat"
# Ollama caps the context at its own default (4k) regardless of what the model supports, and
# silently truncates longer prompts, so run against a derived model that raises it:
#   printf 'FROM qwen2.5:7b\nPARAMETER num_ctx 16384\n' > Modelfile
#   ollama create qwen2.5-7b-ctx16k -f Modelfile
model = "qwen2.5-7b-ctx16k"
base_url = "http://localhost:11434/v1"
api_key_env = "LOCAL_LLM_API_KEY"
tool_mode = "native"
knowledge_cutoff = "2023-10"           # verify on the model card
temperature = 0.0
max_tokens = 4096
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0

[models.llama31-8b]
backend = "openai_compat"
# Second model family, same size class as qwen2.5-7b, so a difference between the two is a
# model difference rather than a capacity one. Built with the context raised, as above:
#   printf 'FROM llama3.1:8b\nPARAMETER num_ctx 16384\n' > Modelfile
#   ollama create llama3.1-8b-ctx16k -f Modelfile
model = "llama3.1-8b-ctx16k"
base_url = "http://localhost:11434/v1"
api_key_env = "LOCAL_LLM_API_KEY"
tool_mode = "native"
knowledge_cutoff = "2023-12"           # verify on the model card
temperature = 0.0
max_tokens = 4096
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0

[models.claude-opus]
backend = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
knowledge_cutoff = "post-2025"         # late cutoff: an upper bound, leakage-prone by design
max_tokens = 16000
price_in_per_mtok = 4.0
price_out_per_mtok = 20.0

[models.mock]
backend = "mock"
model = "mock"
knowledge_cutoff = "n/a"
